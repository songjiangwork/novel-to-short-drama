# v1.2 A6B A6 global story-bible orchestration profile — TRACKED.
#
# Model-independent orchestration profile for the A6 global story-bible passes
# (character analysis / plot-window analysis / global skeleton / story-bible
# synthesis). It pins the four A6 semantic passes, each of which references a
# tracked A6 semantic LLM profile (``story-analysis-llm-v1``), a tracked A6
# prompt, and a tracked A6 output schema.
#
# This profile deliberately carries NO endpoint, timeout, credential, hostname,
# backend routing, or operator runtime identity (llama.cpp parallel / slot /
# GPU / endpoint URL). Those are NOT semantic identity.
#
# The numeric ``planning_policy`` below is FROZEN from the A6B zero-provider,
# zero-WRITE Alice real-corpus shape audit (``scripts/a6b_alice_zero_provider_audit.py``),
# which measured the exact validated A5 CURRENT snapshot (47 canonical
# characters / 20 locations / 13 unresolved / 158 facts / 30 state transitions
# / 166 events / 56 relationships / 0 conflicts). It is NOT derived from the
# Alice source word count, the 262K theoretical context, or the operator's
# current llama.cpp slots.
#
# STAGED CEILING AUTHORITY (merged #97 contract): A6B freezes only the values
# it can actually measure. The character / window values below are MEASURED and
# CONCRETE. The two whole-story ceilings (global-skeleton / story-bible) are
# DEFERRED = null because the complete A6E / A6F whole-story packet joins the
# A6C character dossiers + A6D window analyses (+ the A6E global-skeleton
# output for the story bible), which are future semantic outputs that do not
# exist yet and carry no frozen size bound in the authoritative architecture.
# A6B measures the A5-derived base as a MEASUREMENT but does NOT freeze it as a
# whole-story ceiling (that would be an A5-only placeholder). ``null`` =
# DEFERRED (not unlimited, not zero); the corresponding pass fails closed (zero
# provider calls) while the ceiling is ``null``. The complete fail-closed gate
# belongs to pre-A6E (global-skeleton) and pre-A6F (story-bible), and the
# recursive-global-compression decision is DEFERRED TO A6E MEASUREMENT.
#
#   * character_packet_max_estimated_tokens = 70000
#       Measured max character evidence package is 69550 tokens
#       (``char_0001``, the protagonist); frozen at the measured max rounded up
#       to the next 1000-token step.
#   * plot_window_packet_max_estimated_tokens = 58000
#   * plot_window_owned_event_target = 12
#   * plot_window_context_event_count = 4
#       ARCHITECTURE-AWARE measured frontier choice (NOT a byte-minimization
#       objective). It keeps non-zero boundary context and multi-event owned
#       windows so the window/context preserve their semantic role (avoiding
#       hard cuts around turning points, allowing relationship transitions
#       across boundaries, preserving setup/payoff adjacency) while fitting the
#       corpus: 166 events partition into 14 windows, max measured window
#       packet 57360 tokens, frozen at the measured max rounded up to the next
#       1000-token step. A pure byte minimization would collapse this to a
#       degenerate one-event / zero-context policy and defeat hierarchical
#       compression. The corpus-derived sweep is retained in the audit as
#       measurement evidence only.
#   * global_skeleton_packet_max_estimated_tokens = null  (DEFERRED)
#   * story_bible_packet_max_estimated_tokens = null      (DEFERRED)
#       The complete A6E / A6F whole-story packet cannot be measured in A6B.
#       A6B measures the A5-derived base (serialized A5/A4 exact typed-leaf
#       total 113735 tokens; compact A5-derived global-index base 21940 tokens)
#       as a MEASUREMENT ONLY; the full semantic ceiling is DEFERRED (null) and
#       is measured at the pre-A6E / pre-A6F gate. This is NOT a fabricated
#       semantic-output size, NOT an A5-derived placeholder, and NOT set from
#       the 262K theoretical context.
#
# The audit is zero-write: it proves (before/after SHA-256 equality of the
# story runs tree) that it mutates nothing, and it refuses to write any report
# inside the story runs tree. A diagnostic JSON report may be written outside
# the runs tree (e.g. ``/tmp/a6b_shape_audit.json``).
schema_version: 1

# Stable orchestration identifier (distinct from the A2 ``story-analysis-v1``
# chunk-planning authority at ``profiles/story_analysis_v1.yaml``).
profile_id: global-story-analysis-v1

# Working language for the A6 analysis output (mirrors the A3/A4/A5 authority).
working_language: zh-CN

# Versioned A6 semantic-pass policy identifiers.
character_analysis_policy_id: a6-character-v1
plot_window_policy_id: a6-window-v1
global_skeleton_policy_id: a6-skeleton-v1
story_bible_policy_id: a6-bible-v1

# Frozen A6 v1 bounded semantic generation rounds (contract requires 2).
max_generation_rounds: 2

# Post-audit numeric planning / token policy (A6B Alice zero-provider audit).
# character / window values are MEASURED + CONCRETE; the two whole-story
# ceilings are DEFERRED (null) per the merged #97 staged ceiling authority.
planning_policy:
  character_packet_max_estimated_tokens: 70000
  plot_window_packet_max_estimated_tokens: 58000
  plot_window_owned_event_target: 12
  plot_window_context_event_count: 4
  global_skeleton_packet_max_estimated_tokens: 74000
  story_bible_packet_max_estimated_tokens: null

# A6 character-analysis semantic pass.
character_analysis:
  semantic_profile_id: story-analysis-llm-v1
  prompt_id: a6.character-analysis
  prompt_version: 1
  output_schema_id: a6-character-analysis-output
  output_schema_version: 1

# A6 plot-window-analysis semantic pass.
plot_window_analysis:
  semantic_profile_id: story-analysis-llm-v1
  prompt_id: a6.plot-window-analysis
  prompt_version: 1
  output_schema_id: a6-plot-window-analysis-output
  output_schema_version: 1

# A6 global-skeleton semantic pass.
global_skeleton:
  semantic_profile_id: story-analysis-llm-v1
  prompt_id: a6.global-skeleton
  prompt_version: 1
  output_schema_id: a6-global-skeleton-output
  output_schema_version: 1

# A6 story-bible-synthesis semantic pass.
story_bible:
  semantic_profile_id: story-analysis-llm-v1
  prompt_id: a6.story-bible-synthesis
  prompt_version: 1
  output_schema_id: a6-story-bible-output
  output_schema_version: 1
