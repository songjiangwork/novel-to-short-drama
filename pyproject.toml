[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-to-short-drama"
version = "1.1.0"
description = "Structured MiniMax H3 short-drama production pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
short-drama = "short_drama.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
