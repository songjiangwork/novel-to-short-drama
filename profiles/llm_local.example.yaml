# v1.2 A-I3 LLM runtime transport config — TRACKED EXAMPLE.
#
# Copy this to profiles/llm_local.yaml (which is gitignored) and adjust the
# base_url / credential for your local machine. profiles/llm_local.yaml must
# NEVER be committed; it is machine-specific.
#
# This file describes connection/runtime details AND the declared backend
# routing identity (request_model / provider_family). It must not contain
# temperature, reasoning, prompt version, or output-token budget — those
# belong to the semantic profile (see profiles/story_extraction_llm_v1.yaml).
#
# NOTE: request_model is the backend model the transport requests (and the
# model recorded in the invocation provenance). It is deliberately NOT part of
# the A-I3 semantic/reuse identity, so changing it (e.g. Qwen -> Gemma) does not
# invalidate CandidateExtraction reuse.
schema_version: 2

# Stable identifier for this transport endpoint (not a secret).
transport_id: llm-local

# OpenAI-compatible Chat Completions base URL prefix for a local llama.cpp
# server. The adapter appends /chat/completions, so the canonical llama.cpp
# prefix is /v1 -> http://127.0.0.1:8080/v1/chat/completions. Must not embed
# credentials (no user:pass@).
base_url: http://127.0.0.1:8080/v1

# Requested routing model identifier (declared runtime routing metadata), sent in
# the provider request body's "model" field and recorded in the invocation
# provenance. This is the model the client requests, NOT an independently
# verified statement of what the server actually serves. Adjust to the model
# your local endpoint serves.
request_model: ggml-org/Qwen3.8-27B-GGUF:Q4_K_M

# Configured provider-family label (e.g. "qwen") recorded in the invocation
# provenance.
provider_family: qwen

# Name of the environment variable holding the credential, or null for no
# auth. The credential value is only ever read from the environment at request
# time and is never persisted, printed, or hashed. A local llama.cpp server
# typically needs no credential.
credential_environment_name: null

# Per-request timeout in seconds (0, 3600].
timeout_seconds: 300
