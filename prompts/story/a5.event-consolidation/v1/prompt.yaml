# A5 event consolidation prompt — TRACKED (v1.2 A5A).
#
# A strict event-consolidation decision prompt. It is given one event
# consolidation block as a set of PAIR-LOCAL contexts (each pair owns its own
# left/right endpoint event packet), and returns an
# EventSelectorDecisionPayload with exactly one decision per pair, each
# carrying a zh-CN reason and a list of pair-local evidence selectors.
#
# The decision domain is the A5 event decision set: same_event /
# different_event / uncertain.
#
# The provider evidence contract is PAIR-LOCAL SELECTORS (inherited from the
# A4 v3 authority). The provider cites evidence only by selector: L0/L1/...
# selects from the decision's own left endpoint evidence list and R0/R1/...
# selects from the decision's own right endpoint evidence list (both in the
# order shown in the prompt). The host service (A5C) validates every selector
# against that exact pair and resolves it to the exact endpoint EvidenceRef, so
# the provider can never cite a third candidate or alter an evidence field.
#
# The prompt is the event-decision authority, not the merge/authority
# authority: canonical event allocation and narrative ordering remain the A5E
# authority, and local JSON Schema validation remains the schema authority.
#
# required_variables is EXACTLY the two block inputs. Their values are
# deterministic canonical JSON strings built by Python (A5C). No
# runtime/model/provider fields.
schema_version: 1
prompt_id: a5.event-consolidation
version: 1
required_variables:
  - block_id
  - pair_contexts_json
